# [Service] 资源围栏（IO 事件 2026-11-23 处置，见 config/systemd/README 或运维报告）
# 本文件与 override.conf 按文件名字母序合并：l < o < u，后者覆盖前者。
# 实际生效值以 `systemctl show ai-rss-hub` 实测为准（2026-11-23 核验）。
[Service]
# === 资源围栏：让此服务永远只能 OOM/限速自己，不能拖垮整机 ===
# 软限（达到后开始节流/回收），硬限（达到后触发 cgroup OOM kill，仅杀本服务）
# 注意：MemoryHigh/MemoryMax/CPUQuota 被 override.conf 的 512M/768M/150% 覆盖，
# 此处保留旧值仅为保持文件与线上 drop-in 一致，勿单独调大。
MemoryHigh=600M
MemoryMax=800M
MemorySwapMax=512M
# 最多占用 1.2 个核（实际生效 150%，见 override.conf）
CPUQuota=120%
# 限制磁盘读写带宽与 IOPS，给系统 / SSH / 日志留出带宽
# ESSD Entry 40G 物理上限 106MB/s / 2120 IOPS；此处硬限保证应用不可能打满盘。
# IOWriteIOPSMax 补齐写侧：4KB 随机写下 10MB/s 理论可换算 2560 IOPS，超盘上限。
IOReadBandwidthMax=/dev/vda 20M
IOWriteBandwidthMax=/dev/vda 10M
IOReadIOPSMax=/dev/vda 800
IOWriteIOPSMax=/dev/vda 800
# 限制线程/进程数，防止 fd/线程泄漏拖垮系统
TasksMax=256
