# [Service] 内存/CPU 隔离 + 崩溃防风暴（IO 事件 2026-11-23 处置）
# 加载顺序 limits.conf < override.conf < uvicorn.conf，本文件覆盖 limits.conf 的
# MemoryHigh/MemoryMax/CPUQuota（systemctl show 实测：512M/768M/150%）。
[Service]
# === 内存隔离：保整机，防 Swap 击穿 ===
MemoryMax=768M
MemoryHigh=512M

# === CPU 隔离：保底管理通道 ===
CPUQuota=150%

# === 磁盘 IO 隔离：压制 ESSD Entry 压力 ===
IOWeight=50

# === 崩溃防风暴机制 ===
Restart=on-failure
RestartSec=30
StartLimitIntervalSec=300
StartLimitBurst=3
OOMPolicy=stop
