[Service]
# === uvicorn 启动约束（应用层 IO 优化，2026-11-23）===
# 显式单进程（防止意外多进程内存翻倍），并限制并发连接数防止请求堆积
ExecStart=
ExecStart=/home/sam/Github/AI-RSS-Hub/venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --limit-concurrency 50

# 刻意不加 --limit-max-requests：达到阈值后 uvicorn 会优雅重启进程并重新
# 加载 lxml/sqlalchemy 等 C 扩展，每次制造一轮启动 IO 突发（iotop 实测启动
# 瞬间约 9.5 MB/s），与压制 ESSD Entry IO 峰值的目标相反

# 安装方式（需 sudo）：
#   sudo cp config/systemd/uvicorn.conf /etc/systemd/system/ai-rss-hub.service.d/uvicorn.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ai-rss-hub
# 验证：systemctl cat ai-rss-hub | grep ExecStart
